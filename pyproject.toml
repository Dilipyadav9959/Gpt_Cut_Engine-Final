[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "editron-cut-engine"
version = "0.2.0"
description = "Conservative, explainable video editing with inspectable timelines"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
vad = ["torch>=2.4,<3", "silero-vad>=5.1.2,<7"]

[project.scripts]
editron = "editron_cut_engine.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["editron_cut_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
